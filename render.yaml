services:
  - type: web
    name: me-api-playground
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_data.py && uvicorn main:app --host=0.0.0.0 --port=$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: ENVIRONMENT
        value: production